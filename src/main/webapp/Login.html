<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Foodie Express</title>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    background: #f7f5f2;
  }

  /* ---------- Login Section ---------- */
  .login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .login-card {
    background: #fff;
    width: 100%;
    max-width: 400px;
    padding: 40px 35px;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }

  .login-card h2 {
    color: #ee6363;
    text-align: center;
    margin-bottom: 6px;
    font-size: 28px;
  }

  .login-card p.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
    font-size: 14px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #333;
    font-weight: 600;
  }

  .form-group input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-group input:focus {
    border-color: #ee6363;
  }

  .form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #555;
    margin-bottom: 20px;
  }

  .form-options label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .form-options a {
    color: #ee6363;
    text-decoration: none;
  }

  .form-options a:hover {
    text-decoration: underline;
  }

  .btn-login {
    width: 100%;
    background-color: #ee6363;
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .btn-login:hover {
    background-color: #d94f4f;
  }

  .register-link {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #555;
  }

  .register-link a {
    color: #ee6363;
    text-decoration: none;
    font-weight: 600;
  }

  .register-link a:hover {
    text-decoration: underline;
  }

  .error-msg {
    color: #d9302f;
    font-size: 13px;
    text-align: center;
    margin-bottom: 15px;
    display: none;
  }

</style>
</head>
<body>

  <!-- Login Form -->
  <div class="login-wrapper">
    <div class="login-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Login to continue ordering delicious food</p>

      <span class="error-msg" id="loginError">Invalid email or password</span>

      <form id="loginForm" action="callLoginServlet" method="POST">

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

       <div class="form-group password-group">
		    <label for="password">Password</label>
		
		    <input type="password"
		           id="password"
		           name="password"
		           placeholder="Enter your password"
		           required>
		
		</div>

        <div class="form-options">
          <label>
            <input type="checkbox" name="remember"> Remember me
          </label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">Login</button>
      </form>

      <div class="register-link">
        Don't have an account? <a href="Register.html">Register here</a>
      </div>
    </div>
  </div>

  <script>
  
  
    // If LoginServlet redirected here with an error, show it above the form
    (function () {
      const params = new URLSearchParams(window.location.search);
      const error = params.get('error');
      if (error) {
        const errorEl = document.getElementById('loginError');
        errorEl.textContent = error;
        errorEl.style.display = 'block';
      }
    })();
  </script>

  
</body>
</html>
