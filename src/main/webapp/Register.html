<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Foodie Express</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    background: #f7f5f2;
  }

  /* ---------- Register Section ---------- */
  .register-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .register-card {
    background: #fff;
    width: 100%;
    max-width: 430px;
    padding: 40px 35px;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }

  .register-card h2 {
    color: #ee6363;
    text-align: center;
    margin-bottom: 6px;
    font-size: 28px;
  }

  .register-card p.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
    font-size: 14px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #333;
    font-weight: 600;
  }

  .form-group input,
  .form-group select {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-group input:focus,
  .form-group select:focus {
    border-color: #ee6363;
  }

  .btn-register {
    width: 100%;
    background-color: #ee6363;
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background-color 0.2s;
  }

  .btn-register:hover {
    background-color: #d94f4f;
  }

  .login-link {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #555;
  }

  .login-link a {
    color: #ee6363;
    text-decoration: none;
    font-weight: 600;
  }

  .login-link a:hover {
    text-decoration: underline;
  }

  .error-msg {
    color: #d9302f;
    font-size: 13px;
    margin-top: 4px;
    display: none;
  }
</style>
</head>
<body>

  <!-- Register Form -->
  <div class="register-wrapper">
    <div class="register-card">
      <h2>Create Account</h2>
      <p class="subtitle">Sign up to start ordering your favourite food</p>

      <form  action="callRegisterServlet" method="POST" >

        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        
        
         <div class="form-group">
          <label for="role">Register As</label>
          <select id="role" name="role" required>
            <option value="" disabled selected>Select your role</option>
            <option value="Client">Client</option>
            <option value="Delivery agent">Delivery agent</option>
            <option value="Restartuant owner">Restartuant owner</option>
            <option value="super Admin">super Admin</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" required>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
          <span class="error-msg" id="passError">Passwords do not match</span>
        </div>
        
        <div class="form-group">
          <label for="address">Address</label>
          <textarea id="address" name="address" rows="3" placeholder="Enter your delivery address" required></textarea>
          <!-- <button type="button" class="btn-location" onclick="fetchLocation()">📍 Use my current location</button>
          <span class="error-msg" id="locError">Unable to fetch location. Please enter manually.</span> -->
        </div>

        <button type="submit" class="btn-register">Register</button>
      </form>
      
      	<div class="login-link">
        	Already have an account? 
        	<a href="Login.html">Login here</a>
      	</div>
     
      
    </div>
  </div>

 



</body>
</html>
